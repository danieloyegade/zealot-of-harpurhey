<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050711" />
    <title>Zealot of Harperhey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Herr+Von+Muellerhoff&family=Mrs+Saint+Delafield&display=block"
    />
    <link rel="stylesheet" href="/src/ui/intro.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Title card. See docs/TITLE_SCREEN.md; slots are filled by src/ui/title/marginalia.ts. -->
    <div class="intro" data-intro role="dialog" aria-modal="true" aria-labelledby="intro-title">
      <svg class="intro__defs" aria-hidden="true" focusable="false">
        <!-- Handwriting texture: slight edge wobble and ink breakup, found only on close inspection. -->
        <filter id="intro-ink" x="-5%" y="-10%" width="110%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" result="grain" />
          <feDisplacementMap in="SourceGraphic" in2="grain" scale="2" xChannelSelector="R" yChannelSelector="G" result="wobble" />
          <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="3" result="speckle" />
          <feComponentTransfer in="speckle" result="breakup">
            <feFuncA type="discrete" tableValues="1 1 1 1 1 1 1 1 0.4 1" />
          </feComponentTransfer>
          <feComposite in="wobble" in2="breakup" operator="in" />
        </filter>
      </svg>

      <div class="intro__scrim" aria-hidden="true"></div>
      <div class="intro__fog" aria-hidden="true"></div>
      <div class="intro__light" aria-hidden="true">
        <div class="intro__beam"></div>
        <div class="intro__pool"></div>
        <div class="intro__swell"></div>
      </div>
      <div class="intro__passing" aria-hidden="true"></div>
      <div class="intro__grain" aria-hidden="true"></div>

      <!-- The one calligraphic intervention: the idea behind the place name. -->
      <p class="intro__script" aria-hidden="true">
        <span class="intro__script-print">The Promised Land</span>
        <span class="intro__script-ghost">The Promised Land</span>
      </p>

      <div class="intro__frame">
        <div class="intro__corner intro__corner--top intro__corner--start intro__reveal">
          <p class="intro__line intro__line--primary">The Spectres Are All Around Us</p>
        </div>
        <div class="intro__corner intro__corner--top intro__corner--end intro__reveal">
          <p class="intro__line intro__line--primary">53°31′ N&ensp;2°13′ W</p>
        </div>
        <div class="intro__corner intro__corner--bottom intro__corner--start intro__reveal">
          <p class="intro__line intro__line--secondary">Daniel Oyegade</p>
        </div>
        <div class="intro__corner intro__corner--bottom intro__corner--end intro__reveal">
          <p class="intro__line intro__line--secondary">MMXXVI</p>
        </div>
        <p class="intro__controls" data-intro-slot="controls"></p>
      </div>

      <div class="intro__beat intro__beat--rider z-tone--night" data-intro-slot="rider-beat" aria-hidden="true"></div>
      <div class="intro__beat intro__beat--delivery z-tone--night" data-intro-slot="delivery-beat" aria-live="polite"></div>

      <div class="intro__stage">
        <h1 class="intro__title" id="intro-title">
          <span class="intro__word">Zealot</span>
          <span class="intro__of">of</span>
          <span class="intro__word">Harperhey</span>
        </h1>

        <div class="intro__threshold">
          <div class="intro__status" aria-live="polite">
            <div class="intro__rule" data-intro-rule><div class="intro__rule-fill"></div></div>
            <p class="intro__caption">
              <span data-intro-label>Assembling the city</span>
              <span data-intro-count></span>
            </p>
            <p class="intro__item" data-intro-item></p>
          </div>
          <button class="intro__prompt" type="button" data-intro-prompt disabled>
            <span class="intro__prompt-action">Enter Harperhey</span>
            <span class="intro__prompt-key" data-intro-key>[ Return ]</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      (() => {
        const intro = document.querySelector('[data-intro]');
        if (!intro) return;
        if (new URLSearchParams(location.search).get('intro') === 'off') {
          intro.remove();
          return;
        }
        // Reveal the title only once EB Garamond is ready, so it never flashes in a fallback face.
        const typeset = () => {
          intro.dataset.typesetAt = String(performance.now());
          intro.classList.add('is-typeset');
        };
        Promise.race([
          Promise.all([
            document.fonts.load('400 1em "EB Garamond"'),
            document.fonts.load('italic 400 1em "EB Garamond"'),
            document.fonts.load('400 1em "Herr Von Muellerhoff"'),
          ]),
          new Promise((resolve) => setTimeout(resolve, 2500)),
        ]).then(typeset, typeset);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
