<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050711" />
    <title>Zealot of Harpurhey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Herr+Von+Muellerhoff&family=Mrs+Saint+Delafield&display=block"
    />
    <link rel="stylesheet" href="/src/ui/intro.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Loading plate. See docs/TITLE_SCREEN.md. -->
    <div class="intro" data-intro role="status" aria-labelledby="intro-title">
      <div class="intro__plate">
        <img
          class="intro__artefact"
          src="/ui/title/zealot-loading-screen.png"
          alt=""
          aria-hidden="true"
          draggable="false"
          fetchpriority="high"
        />
        <h1 class="intro__title" id="intro-title">Zealot of Harpurhey</h1>
        <div
          class="intro__progress"
          data-intro-progress
          role="progressbar"
          aria-label="Loading game"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="intro__progress-fill"></div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        const intro = document.querySelector('[data-intro]');
        if (!intro) return;
        if (new URLSearchParams(location.search).get('intro') === 'off') {
          intro.remove();
          return;
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
