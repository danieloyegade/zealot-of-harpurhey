<!doctype html><html><head><title>Movement audio regression</title></head><body><pre id="result">Running…</pre><script type="module">
import { MovementAudio } from '/src/audio/MovementAudio.ts';
// Actual Web Audio test: the footstep clips decode and play, the bike layers
// make sound while riding and go quiet again once the bike is left.
const audio = new MovementAudio();
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
async function peak(ms, each) {
  let highest = 0;
  const end = performance.now() + ms;
  while (performance.now() < end) { each?.(); highest = Math.max(highest, audio.outputLevel()); await wait(15); }
  return +highest.toFixed(4);
}
const bike = (over) => ({ speed: 4.6, pedalling: 0, motorAssist: 0, braking: false, ...over });
const results = {};
// Browsers only run audio after a real gesture: click anywhere on the page.
document.querySelector('#result').textContent = 'Click the page to start…';
for (let i = 0; i < 400 && audio.context?.state !== 'running'; i += 1) await wait(100);
for (let i = 0; i < 100 && audio.steps.length < 5; i += 1) await wait(50);
results.clipsDecoded = audio.steps.length;
results.contextState = audio.context?.state;
results.idle = await peak(300);
audio.footfall(false); results.walkStep = await peak(250);
await wait(400);
audio.footfall(true); results.runStep = await peak(250);
await wait(400);
results.afterSteps = await peak(200);
results.coasting = await peak(1200, () => audio.updateBike(bike({})));
results.pedallingWithMotor = await peak(1200, () => audio.updateBike(bike({ pedalling: 1, motorAssist: 1 })));
results.braking = await peak(1200, () => audio.updateBike(bike({ speed: 6, braking: true })));
results.boost = await peak(1200, () => audio.updateBike(bike({ speed: 20, pedalling: 1, motorAssist: 1 })));
results.offBike = 1;
await peak(1500, () => audio.updateBike(null));
results.offBike = await peak(300, () => audio.updateBike(null));
const p = results;
const pass = p.clipsDecoded === 5 && p.contextState === 'running' && p.idle < 0.001
  && p.walkStep > 0.01 && p.runStep > p.walkStep * 0.9 && p.afterSteps < 0.002
  && p.coasting > 0.003 && p.pedallingWithMotor > 0.003 && p.braking > 0.003
  && p.boost > p.coasting && p.offBike < 0.002;
document.querySelector('#result').textContent = JSON.stringify({ pass, ...results }, null, 2);
document.title = pass ? 'PASS' : 'FAIL';
if (!pass) throw new Error('Movement audio regression');
</script></body></html>
